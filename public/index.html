<!DOCTYPE html>
<html>

<head>
  <!-- Meta charset and viewport for responsiveness -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Site title, description & keywords (SEO)-->
  <title>Hagioi</title>
  <meta name="description" content="An All Saints map website.">
  <meta name="keywords" content="holiness, website, map, design, beauty, spiritual, orthodox, church, all saints, hagioi">

  <!-- Author of the website -->
  <meta name="author" content="Theodoros Kyriakidis">

  <!-- Favicon Links -->
  <link rel="icon" href="assets/favicon.png" type="image/png"> <!-- fallback for older browsers -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Social media sharing metadata (Open Graph / Facebook / Twitter) -->
  <meta property="og:title" content="Hagioi">
  <meta property="og:description" content="An All Saints map website.">
  <meta property="og:image" content="assets/social-image.jpg">
  <meta property="og:url" content="https://thekyria.github.io/hagioi/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hagioi">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hagioi">
  <meta name="twitter:description" content="An All Saints map website.">
  <meta name="twitter:image" content="assets/social-image.jpg">
  <meta name="twitter:creator" content="@thekyria_gr">
  
  <!-- Google Fonts link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet">

  <!-- Additional CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a href="#home" class="logo">
        <img src="assets/logo.svg" alt="hagioi logo">
      </a>
      <h1>Hagioi</h1>
    </div>
  </header>
  
  <main>
    <div id="app-layout">
      <div id="map"></div>
      <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="saints-panel" aria-label="Open Feast Days panel">
        <span class="menu-toggle-icon" aria-hidden="true">&#9776;</span>
      </button>
      <aside id="saints-panel">
        <div class="saints-panel-header">
          <span>Feast Days</span>
        </div>
        <div id="saints-panel-content">
          <div id="date-filter">
            <div class="date-filter-group">
              <label for="from-month">From</label>
              <select id="from-month" aria-label="From month"></select>
              <select id="from-day" aria-label="From day"></select>
            </div>
            <div class="date-filter-group">
              <label for="to-month">To</label>
              <select id="to-month" aria-label="To month"></select>
              <select id="to-day" aria-label="To day"></select>
            </div>
          </div>
          <ul id="saints-list"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2025 hagioi — All rights reserved.</p>
    <p>Built with ❤️ by <a href="http://thekyria.com" target="_blank" rel="noopener noreferrer">Me</a></p>
  </footer>
  
  <script src="script.js" defer></script>
</body>

</html>
