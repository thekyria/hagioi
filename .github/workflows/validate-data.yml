name: Validate saints data

on:
  push:
  pull_request:

jobs:
  validate-saints-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate saints.json
        run: npm run validate
